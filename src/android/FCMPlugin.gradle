// Cordova gradle reference for cordova-plugin-fcm-modern.
// Versions come from plugin.xml preferences (passed by cordova-android as
// environment variables), overridable via rootProject properties. The host
// app owns Gradle/AGP; this file only declares dependencies and applies
// google-services at most once.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.google.gms:google-services:${rootProject.hasProperty('ANDROID_GOOGLE_SERVICES_VERSION') ? rootProject.ANDROID_GOOGLE_SERVICES_VERSION : (System.getenv('ANDROID_GOOGLE_SERVICES_VERSION') ?: '4.5.0')}"
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:${rootProject.hasProperty('ANDROID_FIREBASE_BOM_VERSION') ? rootProject.ANDROID_FIREBASE_BOM_VERSION : (System.getenv('ANDROID_FIREBASE_BOM_VERSION') ?: '35.1.0')}")
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
}

// The google-services plugin must be applied exactly once per module.
if (!project.plugins.hasPlugin('com.google.gms.google-services')) {
    apply plugin: com.google.gms.googleservices.GoogleServicesPlugin
}
