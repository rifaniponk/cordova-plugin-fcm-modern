/*
 * Shared toolchain wiring for the Android consumer fixtures. Every path is
 * resolved relative to the repository (never absolute), the same way
 * scripts/native-jvm.mjs resolves the repo-local JDK. The jar names below are
 * the classes.jar/jar of the Maven coordinates declared in each fixture.json;
 * scripts/android-compile.mjs verifies each one exists and names the
 * coordinate when a jar is missing.
 */
ext.toolchainDir = rootProject.file('../../.tmp/toolchain')

// Android SDK platform jar: the real android.* + org.json API surface.
ext.androidJar = new File(ext.toolchainDir, 'android.jar')

ext.jarNames = { names ->
    names.collect { new File(ext.toolchainDir, it) }.findAll { it.exists() }
}

// Firebase Messaging + Play Services Tasks/base/basement (real aar classes.jar).
ext.firebaseJars = jarNames([
    'firebase-messaging-26.0.1.jar',
    'firebase-common-23.0.0.jar',
    'play-services-tasks-18.4.0.jar',
    'play-services-base-18.9.0.jar',
    'play-services-basement-18.9.0.jar'
])

